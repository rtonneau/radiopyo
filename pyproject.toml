[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "RadioPyo_vec_rtonneau"
version = "0.0.1"
authors = [
  { name="Romain Tonneau", email="romain.tonneau@unamur.be" },
]
description = "A small package to perform FLASH simulations with resolution of ODE's"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
parser = "python tests/parser.py"
export_env = 'conda env export -n radiobio  | findstr -v "prefix pip radiopyo" > .env/radiobio.yaml'
import_env = 'mamba env create --file .env/radiobio.yaml'
clean_env = 'mamba env remove -n radiobio'

[tool.hatch.build.targets.wheel.hooks.mypyc]
dependencies = ["hatch-mypyc"]

[tool.hatch.build]
exclude = [
  ".env",
  ".vscode",
  "tests",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.mypy]
disallow_untyped_defs = true
follow_imports = "normal"
ignore_missing_imports = false
pretty = true
show_column_numbers = true
warn_no_return = true
warn_unused_ignores = true
exclude = "tests"

[tool.ruff]
extend-exclude = ["tests/"]
extend-select = [
    "B",
    "BLE",
    "C4",
    "ERA",
    "I",
    "ICN",
    "INP",
    "ISC",
    "N",
    "NPY",
    "PGH",
    "PIE",
    # "PTH",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TCH",
    "TID",
    "YTT",
]
ignore = ["E402", "B905", "N818", "S101", "N815", "N803", "N806", "N802", "E731"]
show-fixes = true
target-version = "py39"

