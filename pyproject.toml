[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radiopyo"
version = "0.7.0"
authors = [{ name = "Romain Tonneau", email = "romain.tonneau@unamur.be" }]
description = "A small module to perform UHDR/CONV simulations with resolution of ODE's"
readme = "README.md"
requires-python = ">=3.11"
license = "LGPL-3.0-only"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "pandas>=1.5.3",
  "numpy>=1.24.3",
  "scipy>=1.10.1",
  "lark>=1.1.2",
  "more-itertools",
  "h5py>=3.8",
]

[project.optional-dependencies]
dev = ["mypy", "pytest", "pandas-stubs>=1.5.3"]
tqdm = ["tqdm"]

[project.urls]
"Source" = "https://github.com/rtonneau/radiopyo"

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
parser = "python tests/parser.py"
export_env = 'conda env export -n radiobio  | findstr -v "prefix pip radiopyo" > .env/radiobio.yaml'
import_env = 'conda env create --file .env/radiobio.yaml'
clean_env = 'conda env remove -n radiobio'

# [tool.hatch.build.targets.wheel.hooks.mypyc]
# dependencies = ["hatch-mypyc"]

[tool.hatch.build]
exclude = [".env", ".vscode", "tests", "doc", "radiopyo/data/IBA"]

[tool.hatch.build.targets.wheel]
packages = ["radiopyo"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
filterwarnings = ["ignore:::.*lark*"]

[tool.coverage.run]
omit = ["tests/*", "radiopyo/data/*"]

[tool.coverage.report]
exclude_lines = [
  "raise NotImplementedError",
  "if tp.TYPE_CHECKING:",
  "def make_hash",
]

[tool.mypy]
disallow_untyped_defs = true
follow_imports = "normal"
ignore_missing_imports = false
pretty = true
show_column_numbers = true
warn_no_return = true
# False: unused-ignore reports differ between mypy/h5py/pandas-stubs versions
warn_unused_ignores = false
exclude = ["tests/.*"]

[[tool.mypy.overrides]]
module = ["h5py", "h5py.*"]
ignore_missing_imports = true

[tool.ruff]
extend-exclude = ["tests/"]
show-fixes = true
target-version = "py311"

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "B",
  "BLE",
  "C4",
  "ERA",
  "I",
  "ICN",
  "INP",
  "ISC",
  "N",
  "NPY",
  "PGH",
  "PIE",
  # "PTH",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "T20",
  "TID",
  "YTT",
]
ignore = [
  "E402",
  "B905",
  "N818",
  "S101",
  "N815",
  "N803",
  "N806",
  "N802",
  "E731",
]
