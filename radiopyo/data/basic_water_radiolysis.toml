[[reactions.k_reaction]]  # 24) O_r_minus + O2 -> O3_minus
reactants = ["O_r_minus", "O2",]
products = ["O3_minus",]
k_value = 3.6e9

[[reactions.k_reaction]]  # 25) O_r_minus + O2_r_minus -> 2 OH_minus + O2
reactants = ["O_r_minus", "O2_r_minus",]
products = ["OH_minus", "OH_minus"," O2",]
k_value = 6.0e8