# ------------------- Reactions involving O_r_minus as reactant --------------------
[[reactions.k_reaction]]  # 23) O_r_minus + H2O -> OH_minus + OH_r
reactants = ["O_r_minus", "H2O",]
products = ["OH_minus", "OH_r",]
