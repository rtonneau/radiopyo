<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="160" viewBox="0 0 520 160" role="img" aria-labelledby="title desc">
  <title id="title">radiopyo</title>
  <desc id="desc">An H2O molecule emitting a radiation wave, next to the radiopyo wordmark.</desc>
  <!-- Neutral mid-tone colours (stroke #1f6fb2, text #5a6270) stay readable on both light and dark backgrounds. -->
  <g transform="translate(20,20)">
    <!-- Radiation wave, from the molecule outwards -->
    <g fill="none" stroke="#e0a100" stroke-width="3" stroke-linecap="round">
      <path d="M 98 40 q 8 20 0 40" />
      <path d="M 112 28 q 14 32 0 64" />
      <path d="M 126 16 q 20 44 0 88" />
    </g>
    <!-- Bonds -->
    <g stroke="#5a6270" stroke-width="5" stroke-linecap="round">
      <line x1="42" y1="82" x2="22" y2="48" />
      <line x1="42" y1="82" x2="62" y2="48" />
    </g>
    <!-- Oxygen atom (H2O) and hydrogens -->
    <circle cx="42" cy="82" r="18" fill="#1f6fb2" />
    <circle cx="20" cy="40" r="10" fill="#9aa3b0" />
    <circle cx="64" cy="40" r="10" fill="#9aa3b0" />
    <!-- Radical dot on the oxygen (OH_r / H2O radiolysis) -->
    <circle cx="60" cy="72" r="4" fill="#e0a100" />
  </g>
  <!-- Wordmark drawn with generic fonts, no external resource required -->
  <text x="190" y="108" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="bold" fill="#1f6fb2">radiopyo</text>
</svg>
